<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard - VasuStyle</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-100 min-h-screen">

    <nav class="bg-stone-900 text-white px-8 py-5 flex justify-between items-center">

        <div>
            <h1 class="text-2xl font-bold">
                VasuStyle
            </h1>

            <p class="text-sm text-stone-400">
                User Panel
            </p>
        </div>

        <a
            href="{% url 'logout' %}"
            class="bg-white text-stone-900 px-5 py-2 rounded-lg font-medium hover:bg-stone-200"
        >
            Logout
        </a>

    </nav>


    <main class="max-w-6xl mx-auto p-8">

        <div class="mb-8">
            <h2 class="text-3xl font-bold text-stone-900">
                Products
            </h2>

            <p class="text-stone-500 mt-1">
                Explore our latest products
            </p>
        </div>


        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            {% for product in products %}

            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">

                <img
                src="{{ product.product_image.url }}"
                alt="{{ product.product_name }}"
                class="w-full h-64 object-cover"
>

                <div class="p-5">

                    <h3 class="text-xl font-bold text-stone-900">
                        {{ product.product_name }}
                    </h3>

                    <p class="text-lg font-semibold text-stone-700 mt-2">
                        ₹{{ product.product_price }}
                    </p>

                    <p class="text-stone-500 mt-3">
                        {{ product.product_description }}
                    </p>

                </div>

            </div>

            {% empty %}

            <div class="col-span-full text-center py-16">

                <p class="text-stone-500 text-lg">
                    No products available.
                </p>

            </div>

            {% endfor %}

        </div>

    </main>

</body>
</html>
